name: CI

# Copy to .github/workflows/ci.yml to activate. checkout and setup-node are
# pinned to Node 24 majors; Node 20 left GitHub-hosted runners on 2026-09-16.

on:
  pull_request:
  push:
    branches:
      - main
      - arena/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck and build
        run: npm run build
